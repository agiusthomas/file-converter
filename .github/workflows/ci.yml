name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test native conversion and recovery
        env:
          FILE_CONVERTER_MEDIA_TESTS: "1"
        run: ./scripts/swift-local.sh test
      - name: Build release app
        run: ./scripts/build-app.sh release
      - name: Verify app signature
        run: codesign --verify --deep --strict "build/Glacier File Converter.app"
